orts for its highly engaged digital users, because a retained member is not always a highly engaged one.\n\nThe composite retained about 11,000 users over five years, roughly 2,200 a year. This model retains about 750 a year, so it sits well inside the evidence.", "valueAreaId": "revenue-expansion", "scenarioSensitive": true, "citations": [{"source": "https://lumindigital.com/?p=8567", "title": "451 Research / S&P Global Market Intelligence: Technology Impact on Business Report (Lumin Digital composite)"}, {"source": "https://lumindigital.com/impact/pacific-service-credit-union-from-fragmented-experience-to-enterprise-grade-digital-banking-with-lumin-digital/", "title": "Pacific Service Credit Union ($1.3B, 70,000 members): 95.5% retention of engaged users, testing staff 3 FTE to 1-2"}, {"source": "https://lumindigital.com/impact/", "title": "Lumin Digital: Proven Impact (platform-wide client statistics)"}], "formula": {"inputs": [{"slug": "annual_attrition_rate", "label": "Baseline annual attrition of digital users", "kind": "category_baseline", "value": 0.07, "unit": "fraction", "source": "Assumed pre-Lumin attrition. Credit union member attrition commonly runs 5% to 10% a year; validate against the prospect's own closed-account data."}, {"slug": "churn_reduction", "label": "Reduction in user churn", "kind": "improvement_driver", "value": 0.15, "unit": "fraction", "source": "451 Research composite: 15% reduction in overall user churn."}, {"slug": "retained_member_balance", "label": "Average deposit balance of a retained member", "kind": "category_baseline", "value": 15000, "unit": "USD", "source": "Conservative versus the $66K average for Pacific Service's highly engaged users."}], "steps": [{"name": "members_retained", "expression": "g_digital_users * annual_attrition_rate * churn_reduction", "outputUnit": "members", "isOutput": false}, {"name": "value_per_retained_member", "expression": "retained_member_balance * g_deposit_spread + g_noninterest_revenue_per_member", "outputUnit": "USD", "isOutput": false}, {"name": "annual_value", "expression": "members_retained * value_per_retained_member", "outputUnit": "USD", "isOutput": true}]}, "rawAnnualBenefit": 328860.0, "realizationFactor": 1}, {"id": "digital-member-acquisition", "name": "Digital Account Opening: New Member Growth", "lead": "Membership stops depending on branch hours. Consumers went from 50 to 200+ digital memberships a month, and Red Canoe grew funded online memberships 81%.", "description": "Scales Consumers Credit Union's lift of roughly 150 extra digital memberships a month from 156,000 members down to this 120,000 member institution, giving about 115 a month.\n\nOnly half of those are treated as truly incremental. The other half are assumed to be members who would have joined in a branch anyway, so the model claims channel shift for nothing and growth for half.\n\nNew members are valued on a modest $6,000 opening balance. Consumers has gathered $68M in deposits through its digital office, so balances could prove higher.", "valueAreaId": "revenue-expansion", "scenarioSensitive": true, "citations": [{"source": "https://lumindigital.com/impact/consumers-credit-union-where-being-first-is-the-culture-and-lumin-digital-is-the-partner/", "title": "Consumers Credit Union ($2.9B, 156,000 members): digital account opening, fraud prevention, system consolidation"}, {"source": "https://lumindigital.com/wp-content/uploads/2026/04/Red-Canoe-Alloy-Case-Study-040726.pdf", "title": "Red Canoe Credit Union ($1.2B, 60,000 members): 81% more funded online memberships, manual review cut from 100% to ~20%"}, {"source": "https://lumindigital.com/wp-content/uploads/2026/04/TAPCO-CU-Case-Study-042326.pdf", "title": "TAPCO Credit Union ($719M, 31,000 members): digital branch, DAO staffing 3 FTE to 1, in-app offers 4% vs 1.5% mail"}, {"source": "https://lumindigital.com/impact/bcu-drives-5-referral-growth-and-builds-a-channel-less-banking-environment-with-lumin/", "title": "BCU (360,000 members): 5-6% of new member growth from referrals, 20% log in daily"}], "formula": {"inputs": [{"slug": "added_digital_memberships_per_month", "label": "Additional digital memberships per month", "kind": "category_baseline", "value": 115, "unit": "members", "source": "Consumers: 50 to 200+ a month at 156,000 members, an increase of ~150, scaled to 120,000 members."}, {"slug": "incremental_share", "label": "Share that is net new to the institution", "kind": "improvement_driver", "value": 0.5, "unit": "fraction", "source": "Conservative attribution. The rest is treated as branch-to-digital channel shift."}, {"slug": "new_member_balance", "label": "Average first-year deposit balance per new member", "kind": "category_baseline", "value": 6000, "unit": "USD", "source": "Assumption to validate with the prospect's new member cohort data."}], "steps": [{"name": "net_new_members", "expression": "added_digital_memberships_per_month * 12 * incremental_share", "outputUnit": "members", "isOutput": false}, {"name": "value_per_new_member", "expression": "new_member_balance * g_deposit_spread + g_noninterest_revenue_per_member", "outputUnit": "USD", "isOutput": false}, {"name": "annual_value", "expression": "net_new_members * value_per_new_member", "outputUnit": "USD", "isOutput": true}]}, "rawAnnualBenefit": 144900.0, "realizationFactor": 1}, {"id": "products-per-relationship", "name": "Digital Cross-Sell: More Products per Member", "lead": "In-app offers reach members where they already are. TAPCO sees 4% response in-app against 1.5% by mail, and Citadel grew digital cross-sell 30% year over year.", "description": "451 Research measures an 11% increase in products per user relationship over five years. This model spreads that evenly, about 2.2% a year, rather than claiming the full lift in any single year.\n\nEach added product is valued at $40 of annual net contribution, a blended figure across savings, card and loan products. Citadel's 30% annual cross-sell growth and Red Canoe's 1,055% jump in secondary savings openings from one campaign both suggest the model is cautious.", "valueAreaId": "revenue-expansion", "scenarioSensitive": true, "citations": [{"source": "https://lumindigital.com/?p=8567", "title": "451 Research / S&P Global Market Intelligence: Technology Impact on Business Report (Lumin Digital composite)"}, {"source": "https://lumindigital.com/wp-content/uploads/2025/06/Citadel-Case-Study-061825.pdf", "title": "Citadel Credit Union ($6B, 260,000 members): +30% digital cross-sell, 84% chatbot containment, +20 NPS"}, {"source": "https://lumindigital.com/wp-content/uploads/2026/04/TAPCO-CU-Case-Study-042326.pdf", "title": "TAPCO Credit Union ($719M, 31,000 members): digital branch, DAO staffing 3 FTE to 1, in-app offers 4% vs 1.5% mail"}, {"source": "https://lumindigital.com/wp-content/uploads/2026/04/Red-Canoe-Alloy-Case-Study-040726.pdf", "title": "Red Canoe Credit Union ($1.2B, 60,000 members): 81% more funded online memberships, manual review cut from 100% to ~20%"}], "formula": {"inputs": [{"slug": "products_per_member", "label": "Current products per digital member", "kind": "category_baseline", "value": 2.0, "unit": "products", "source": "Assumed baseline. Pull the real figure from the prospect's core."}, {"slug": "annual_products_uplift", "label": "Annual increase in products per relationship", "kind": "improvement_driver", "value": 0.022, "unit": "fraction", "source": "451 Research: 11% over five years, spread evenly."}, {"slug": "value_per_product", "label": "Annual net contribution per added product", "kind": "category_baseline", "value": 40, "unit": "USD", "source": "Blended assumption across deposit, card and loan products."}], "steps": [{"name": "added_products", "expression": "g_digital_users * products_per_member * annual_products_uplift", "outputUnit": "products", "isOutput": false}, {"name": "annual_value", "expression": "added_products * value_per_product", "outputUnit": "USD", "isOutput": true}]}, "rawAnnualBenefit": 126720.0, "realizationFactor": 1}]}, {"id": "operational-efficiency", "name": "Operational Efficiency", "description": "Contact center, branch, account opening and platform effort that members and staff no longer spend.", "included": true, "factor": 1, "categories": [{"id": "contact-center-deflection", "name": "Contact Center Call Deflection", "lead": "Members serve themselves. 451 Research measures 21% fewer calls, Citadel's chatbot contains 84% of conversations, and LAFCU cut emailed inquiries from 3,000+ to 1,100.", "description": "Applies the 21% call volume reduction from the 451 Research composite to an assumed four calls per member per year.\n\nEach call is costed on handle time alone at the burdened hourly rate, with no overhead or abandoned-call cost added. Freed time then takes the 50% recapture rate, because fewer calls only become money when hiring slows or staff move to revenue work.", "valueAreaId": "operational-efficiency", "scenarioSensitive": true, "citations": [{"source": "https://lumindigital.com/?p=8567", "title": "451 Research / S&P Global Market Intelligence: Technology Impact on Business Report (Lumin Digital composite)"}, {"source": "https://lumindigital.com/wp-content/uploads/2025/06/Citadel-Case-Study-061825.pdf", "title": "Citadel Credit Union ($6B, 260,000 members): +30% digital cross-sell, 84% chatbot containment, +20 NPS"}, {"source": "https://lumindigital.com/wp-content/uploads/2025/11/LAFCU-Case-Study-110325.pdf", "title": "Los Angeles Federal Credit Union ($1.2B, 75,000 members): inquiries cut from 3,000+ to 1,100, one platform replaces two"}, {"source": "https://lumindigital.com/impact/case-study-how-lumin-digital-helped-consumers-credit-union/", "title": "Consumers Credit Union: 2019 conversion, peak-load uptime and servicing automation"}], "formula": {"inputs": [{"slug": "calls_per_member", "label": "Contact center calls per member per year", "kind": "category_baseline", "value": 4, "unit": "calls", "source": "Assumption. Replace with the prospect's actual annual call volume divided by members."}, {"slug": "call_reduction", "label": "Reduction in call volume", "kind": "improvement_driver", "value": 0.21, "unit": "fraction", "source": "451 Research composite: 21% reduction in call-center volume."}, {"slug": "minutes_per_call", "label": "Average handle time per call", "kind": "category_baseline", "value": 6, "unit": "minutes", "source": "Typical credit union contact center handle time including wrap-up."}], "steps": [{"name": "calls_avoided", "expression": "g_total_members * calls_per_member * call_reduction", "outputUnit": "calls", "isOutput": false}, {"name": "hours_saved", "expression": "calls_avoided * minutes_per_call / 60", "outputUnit": "hours", "isOutput": false}, {"name": "annual_value", "expression": "hours_saved * g_fully_burdened_hourly_rate * g_productivity_recapture_rate", "outputUnit": "USD", "isOutput": true}]}, "rawAnnualBenefit": 226800.0, "realizationFactor": 1}, {"id": "branch-transaction-shift", "name": "Branch Transaction Shift to Digital", "lead": "Routine transactions leave the teller line. 451 Research measures 17% fewer branch transactions, and SESLOC grew digital transactions 35%.", "description": "Applies the 17% branch transaction reduction from the 451 Research composite to an assumed five teller transactions per member per year, at four minutes each.\n\nThe 50% recapture rate applies. Branch time usually converts to value through attrition-based staffing or redeployment to advice, not through immediate cuts.", "valueAreaId": "operational-efficiency", "scenarioSensitive": true, "citations": [{"source": "https://lumindigital.com/?p=8567", "title": "451 Research / S&P Global Market Intelligence: Technology Impact on Business Report (Lumin Digital composite)"}, {"source": "https://lumindigital.com/impact/sesloc-builds-top-tier-digital-banking-experience/", "title": "SESLOC Credit Union ($1.2B, 55,000 members): 35% more digital transactions, weekly releases"}, {"source": "https://lumindigital.com/impact/ascend-reinvents-digital-member-experience/", "title": "Ascend Federal Credit Union (260,000 members): +11% digital users, 75% mobile-only"}], "formula": {"inputs": [{"slug": "branch_txns_per_member", "label": "Teller transactions per member per year", "kind": "category_baseline", "value": 5, "unit": "transactions", "source": "Assumption. Replace with the prospect's teller transaction counts."}, {"slug": "branch_txn_reduction", "label": "Reduction in branch transactions", "kind": "improvement_driver", "value": 0.17, "unit": "fraction", "source": "451 Research composite: 17% reduction in branch transactions."}, {"slug": "minutes_per_txn", "label": "Staff minutes per teller transaction", "kind": "category_baseline", "value": 4, "unit": "minutes", "source": "Assumed average across deposits, withdrawals and transfers."}], "steps": [{"name": "transactions_shifted", "expression": "g_total_members * branch_txns_per_member * branch_txn_reduction", "outputUnit": "transactions", "isOutput": false}, {"name": "hours_saved", "expression": "transactions_shifted * minutes_per_txn / 60", "outputUnit": "hours", "isOutput": false}, {"name": "annual_value", "expression": "hours_saved * g_fully_burdened_hourly_rate * g_productivity_recapture_rate", "outputUnit": "USD", "isOutput": true}]}, "rawAnnualBenefit": 153000.0, "realizationFactor": 1}, {"id": "account-opening-automation", "name": "Account Opening Review Automation", "lead": "Most applications no longer need a person. Red Canoe cut manual review from 100% to about 20%, and Consumers raised account opening output 230% on the same headcount.", "description": "Counts one FTE of account opening and review capacity. TAPCO, a $719M credit union, is planning to move its digital account opening team from three FTEs to one. One FTE for an institution nearly three times TAPCO's size is a deliberately low read.\n\nNo recapture rate applies: this is a role avoided or redeployed, not scattered hours.", "valueAreaId": "operational-efficiency", "scenarioSensitive": true, "citations": [{"source": "https://lumindigital.com/wp-content/uploads/2026/04/Red-Canoe-Alloy-Case-Study-040726.pdf", "title": "Red Canoe Credit Union ($1.2B, 60,000 members): 81% more funded online memberships, manual review cut from 100% to ~20%"}, {"source": "https://lumindigital.com/impact/consumers-credit-union-where-being-first-is-the-culture-and-lumin-digital-is-the-partner/", "title": "Consumers Credit Union ($2.9B, 156,000 members): digital account opening, fraud prevention, system consolidation"}, {"source": "https://lumindigital.com/wp-content/uploads/2026/04/TAPCO-CU-Case-Study-042326.pdf", "title": "TAPCO Credit Union ($719M, 31,000 members): digital branch, DAO staffing 3 FTE to 1, in-app offers 4% vs 1.5% mail"}], "formula": {"inputs": [{"slug": "onboarding_ftes_avoided", "label": "Account opening FTEs avoided or redeployed", "kind": "improvement_driver", "value": 1, "unit": "FTEs", "source": "TAPCO: 3 FTE to 1 planned at $719M in assets. Consumers: 230% more output, same headcount."}, {"slug": "annual_hours_per_fte", "label": "Paid hours per FTE per year", "kind": "category_baseline", "value": 2080, "unit": "hours", "source": "Standard full-time year."}], "steps": [{"name": "annual_value", "expression": "onboarding_ftes_avoided * annual_hours_per_fte * g_fully_burdened_hourly_rate", "outputUnit": "USD", "isOutput": true}]}, "rawAnnualBenefit": 93600, "realizationFactor": 1}, {"id": "release-testing-effort", "name": "Digital Release and Testing Effort", "lead": "Weekly vendor releases replace twice-a-year upgrade projects. Pacific Service needed one to two testers instead of three.", "description": "Counts one IT FTE freed from regression testing and upgrade coordination, the low end of Pacific Service's reduction from three testers to one or two.\n\nUses an IT-specific fully loaded cost rather than the member-facing hourly rate.", "valueAreaId": "operational-efficiency", "scenarioSensitive": true, "citations": [{"source": "https://lumindigital.com/impact/pacific-service-credit-union-from-fragmented-experience-to-enterprise-grade-digital-banking-with-lumin-digital/", "title": "Pacific Service Credit Union ($1.3B, 70,000 members): 95.5% retention of engaged users, testing staff 3 FTE to 1-2"}, {"source": "https://lumindigital.com/impact/sesloc-builds-top-tier-digital-banking-experience/", "title": "SESLOC Credit Union ($1.2B, 55,000 members): 35% more digital transactions, weekly releases"}, {"source": "https://lumindigital.com/wp-content/uploads/2025/11/LAFCU-Case-Study-110325.pdf", "title": "Los Angeles Federal Credit Union ($1.2B, 75,000 members): inquiries cut from 3,000+ to 1,100, one platform replaces two"}], "formula": {"inputs": [{"slug": "it_ftes_freed", "label": "IT testing FTEs freed", "kind": "improvement_driver", "value": 1, "unit": "FTEs", "source": "Pacific Service: testing staff cut from 3 FTE to 1-2."}, {"slug": "it_fte_cost", "label": "Fully loaded annual cost per IT FTE", "kind": "category_baseline", "value": 120000, "unit": "USD", "source": "Salary plus benefits for a QA or digital operations analyst."}], "steps": [{"name": "annual_value", "expression": "it_ftes_freed * it_fte_cost", "outputUnit": "USD", "isOutput": true}]}, "rawAnnualBenefit": 120000, "realizationFactor": 1}]}, {"id": "cost-reduction", "name": "Cost Reduction", "description": "Direct spend retired on point solutions the unified platform replaces.", "included": true, "factor": 1, "categories": [{"id": "point-solution-consolidation", "name": "Point Solution Consolidation", "lead": "One platform replaces several. Consumers moved five systems into one connected workflow, and LAFCU stopped paying to run separate desktop and mobile platforms.", "description": "Retires two point solutions and nothing more: a standalone digital account opening tool and a separate business banking front end. Consumers consolidated five systems into one, so two is conservative.\n\nEach is priced separately rather than at a flat average. Account opening tools are usually billed per application, so that line is built from volume; the business banking portal is billed per business user.\n\nThis is the line to rebuild first in discovery from the prospect's actual vendor contracts. It counts license spend only; staff time is already counted in the Operational Efficiency categories.", "valueAreaId": "cost-reduction", "scenarioSensitive": true, "citations": [{"source": "https://lumindigital.com/impact/consumers-credit-union-where-being-first-is-the-culture-and-lumin-digital-is-the-partner/", "title": "Consumers Credit Union ($2.9B, 156,000 members): digital account opening, fraud prevention, system consolidation"}, {"source": "https://lumindigital.com/wp-content/uploads/2025/11/LAFCU-Case-Study-110325.pdf", "title": "Los Angeles Federal Credit Union ($1.2B, 75,000 members): inquiries cut from 3,000+ to 1,100, one platform replaces two"}], "formula": {"inputs": [{"slug": "dao_applications_per_year", "label": "Digital account applications per year", "kind": "category_baseline", "value": 4380, "unit": "applications", "source": "Roughly 365 applications a month for a 120,000 member institution, consistent with ~200 funded memberships a month at a ~55% application-to-funded rate."}, {"slug": "dao_cost_per_application", "label": "Standalone account opening tool cost per application", "kind": "category_baseline", "value": 13.41, "unit": "USD", "source": "Assumed per-application vendor fee, including identity verification bundled by the tool."}, {"slug": "business_banking_users", "label": "Business banking portal users", "kind": "category_baseline", "value": 1269, "unit": "users", "source": "Business members using a separate commercial portal. Assumption; pull from the current vendor invoice."}, {"slug": "business_portal_cost_per_user", "label": "Business banking portal cost per user per year", "kind": "category_baseline", "value": 35.83, "unit": "USD"
